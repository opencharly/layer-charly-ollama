charly-ollama:
    candy:
        description: |-
            Metadata concept candy owning the charly-ollama skills whose names have no namesake candy (ollama LLM-server image). Owns its family's `skill:` kind entities (sibling nodes in this file) — the
            the plugins→candies migration; candy/plugin-marketplace regenerates the marketplace
            corpus (the standalone opencharly/marketplace repo) from them.
        plan:
            - run: this documentation-only candy ships no install content (it carries the family's skill/hook/marketplace entities); validate-satisfying no-op
              command: "true"
              context:
                - build
            - check: the ollama concept candy's skill entities are present and generated into the marketplace's ollama/skills
              id: charly-ollama-present
              context:
                - build
              command: "true"

ollama-layer-skill:
    skill:
        name: ollama-layer
        family: ollama
        owner: charly-ollama
        description: |-
            Ollama LLM server on port 11434 with model persistence; this candy declares no CUDA
            dependency, and a backend is composed outside it by opting a box into `ollama-cuda` or
            `ollama-rocm`. On a tarball distro the upstream archive already bundles CUDA, so the
            declaration describes what the candy REQUIRES rather than what the image contains.
            Use when working with Ollama, LLM serving, or local AI model inference.
